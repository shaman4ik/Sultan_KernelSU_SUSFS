# ReSukiSU SELinux policyload-seqno stealth (Duck seqno-split oracle).
#
# The oracle: ReSukiSU modifies the LIVE policydb at boot (apply_kernelsu_rules)
# and on every runtime sepolicy ioctl (handle_sepolicy). Access changes, but the
# /sys/fs/selinux/status policyload counter is left as-is at boot and — worse —
# reset_avc_cache() calls selinux_status_update_policyload(0), literally SETTING
# it to 0. A stock kernel's policyload is a monotonic counter that is >=1 after
# boot and never resets. "access moved but policyload==0" is the split Duck flags.
#
# Fix (mirrors selinux_policy_commit -> selinux_notify_policy_change): emit a
# consistent, non-zero seqno instead of 0 through avc_ss_reset / selnl_notify /
# selinux_status_update_policyload, AND run that notify at the end of
# apply_kernelsu_rules so the boot-time policy edit carries a plausible seqno.
#
#   off       — NO-OP (default; ships the stock ReSukiSU reset_avc_cache(0)).
#   seqno     — B-v1: seqno = selinux_state.policy->latest_granting (current
#               committed seqno; kills the ==0 tell, non-monotonic-bump).
#   seqno+1   — B-fallback: seqno = ++latest_granting, exactly what
#               selinux_policy_commit emits (faithful, monotonic) — use only if
#               Duck still flags on monotonicity after seqno.
#
# CONFIG_KSU_HIDE_POLICYLOAD semantics. Risk is low: only counters + AVC flush,
# the su-domain rule injection is untouched. Device-gate: fastboot boot, read
# /sys/fs/selinux/status policyload, then Duck; fallback kernel = e4455eb.
mode=seqno
