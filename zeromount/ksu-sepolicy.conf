# ReSukiSU ksu_file SELinux stealth mode (Duck/LSPosed oracle).
#   keep            — do nothing (type ksu_file present)
#   cut             — remove the 3 KERNEL_SU_FILE rule-injection lines in
#                     apply_kernelsu_rules(): no type, no allow. Kills both oracle
#                     halves (u:object_r:ksu_file:s0 -> EINVAL, no untrusted_app
#                     allow) and leaves nothing under "list custom types".
#   rename:<8char>  — rename instead of cut; requires a matching binary-patch of
#                     the ZeroMount zm blob (tools/README-ksu-type-rename.md).
#
# CUT is safe here: ZeroMount's ext4/overlay storage path (the only ksu_file
# consumer) is dormant in pure-VFS mode and degrades to bare-fallback if ever
# needed. It removes that storage-redirect capability; re-enable via rename:sync
# only if a future module needs storage-backed mounts.
mode=cut
